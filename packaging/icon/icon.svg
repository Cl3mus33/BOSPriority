<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7D32"/>
      <stop offset="1" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="none" stroke="#0F3D12" stroke-width="4"/>

  <!-- Three ranked bars, longest/brightest first, shrinking - reads as a priority list even at
       small sizes without needing separate numbering glyphs. -->
  <rect x="52" y="76" width="152" height="28" rx="14" fill="#FFFFFF"/>
  <rect x="52" y="122" width="116" height="28" rx="14" fill="#C8E6C9"/>
  <rect x="52" y="168" width="84" height="28" rx="14" fill="#81C784" opacity="0.85"/>
</svg>
